project:
  name: baseline_c_mutant_kill
  language: c
  build_cmd: "gcc -Isrc -o calc_test.exe src/calc.c tests/calc_test.c"
  test_result_format: exit_code
  source_roots: ["src"]
  test_roots: ["tests"]
  parallelism: 2
  timeout_sec: 60
  adapter:
    test_binary: calc_test.exe
    c_parser: auto
  mutation:
    operators: [relational, arithmetic, boolean_negation, boundary_value]
  flaky:
    enabled: false
report:
  formats: []
